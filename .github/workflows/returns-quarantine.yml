name: Thanaya - Returns & Frontend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/preview-local.sh'
      - '.github/workflows/returns-quarantine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-returns-and-build:
    # Stable baseline runner. Native RC browsers use a matching image below.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Rehearse quarantine migration on synthetic legacy database
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_return_disposition.py' -v
      - name: Validate guarded migration against stale and damaged backups
        run: python3 -m unittest discover -s backend/tests -p 'test_apply_return_disposition.py' -v
      - name: Rehearse financial migration without touching shop data
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_finance_ledger.py' -v
      - name: Verify guarded finance apply on disposable databases
        run: python3 -m unittest discover -s backend/tests -p 'test_apply_finance_ledger.py' -v
      - name: Rehearse ERP tables on disposable SQLite without touching shop
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_erp_procurement.py' -v
      - name: Guarded ERP migration checks on temporary backups
        run: python3 -m unittest discover -s backend/tests -p 'test_apply_erp_procurement.py' -v
      - name: Rehearse ERP03 receipts on disposable SQLite
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_erp_receiving.py' -v
      - name: Test guarded ERP03 activation on disposable verified backups
        run: python3 -m unittest discover -s backend/tests -p 'test_apply_erp_receiving.py' -v
      - name: Rehearse ERP04 supplier payable schema on private SQLite
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_erp_payables.py' -v
      - name: Guarded ERP04 activation checks on private backups
        run: python3 -m unittest discover -s backend/tests -p 'test_apply_erp_payables.py' -v
      - name: Rehearse ERP05/06 costing and expense schema on SQLite copy
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_erp_cost_cash.py' -v
      - name: Rehearse order history without inventing legacy events
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_order_history.py' -v
      - name: Rehearse session revocation on a clone without changing shop or WAL
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_session_revocation.py' -v
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Integrated RC backup, restore, WAL, full schema and invariant preflight
        run: python3 -m unittest discover -s backend/tests -p 'test_rc_schema_preflight.py' -v
      - name: Verify full RC SQL reference against locked Prisma generator
        run: python3 backend/tests/verify_rc_schema_reference.py
      - name: Isolated order and return checks
        run: npm run test:orders
        working-directory: backend
        env:
          NODE_ENV: test
          # Each runner creates its own temporary SQLite DB inside the test script.
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Auth and session security regression checks
        run: node tests/auth.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Private loopback server binding checks
        run: node --test tests/server-binding.test.cjs
        working-directory: backend
      - name: Durable logout revocation, replay, restart and outage checks
        run: node tests/session-revocation.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
      - name: Order status evidence, authorization and atomic rollback
        run: node tests/order-history.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
      - name: Payment adapter protocol, signature and idempotent refund checks
        run: node --test tests/payment-provider.test.cjs
        working-directory: backend
      - name: Durable payment sandbox restart, replay and isolation checks
        run: node tests/payment-sandbox.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
      - name: Admin role boundary regression checks
        run: node tests/roles.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Delivery and store-settings regression checks
        run: node tests/settings.integration.cjs && node tests/delivery.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Coupons and discount regression checks
        run: node tests/coupons.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Production-dependency vulnerability scan (backend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - name: Isolated financial ledger checks
        run: node tests/finance.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Isolated ERP supplier and purchasing checks
        run: node tests/procurement.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Isolated ERP physical receiving and stock invariants
        run: node tests/receiving.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Isolated supplier invoices and payable ledger checks
        run: node tests/payables.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: ERP05 private cost snapshots and qualified margin test
        run: node tests/cogs.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Verify isolated Mac preview seed and never overwrite real database
        run: node tests/preview.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: ERP06 expense and private cash movement invariants
        run: node tests/cash.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Operational dashboard money, receivables, payables and expiry checks
        run: node tests/operations.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
      - name: Read-only return review, historical cost, refund ceilings and pagination
        run: node tests/return-review.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
      - name: Public catalog search, filter boundaries and cost privacy
        run: node tests/catalog.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Production-dependency vulnerability scan (frontend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Browser-token storage and cookie transport regression guard
        run: node tests/auth-cookie-transport.cjs
        working-directory: frontend
      - name: Saved basket recovery and arithmetic boundaries
        run: node --experimental-strip-types --test tests/cart-state.test.cjs
        working-directory: frontend
      - name: Production frontend build
        run: npm run build
        working-directory: frontend
        env:
          NODE_ENV: production
          THANAYA_INTERNAL_API_ORIGIN: http://127.0.0.1:4000
      - name: Verify production Next.js security response headers
        run: node tests/security-headers.cjs
        working-directory: frontend
        env:
          NODE_ENV: test
      - name: Prepare browser E2E driver
        # Keep the already-built app's lockfile dependency tree unchanged.
        run: npm install --prefix "$RUNNER_TEMP/thanaya-browser-driver" --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - name: Full-stack session and CSRF smoke through Next.js API rewrite
        run: node tests/fullstack-session-proxy.cjs
        working-directory: frontend
        env:
          NODE_ENV: test
          NODE_PATH: ${{ runner.temp }}/thanaya-browser-driver/node_modules
          THANAYA_QA_SCREENSHOT_DIR: ${{ runner.temp }}/thanaya-browser-review
      - name: Preserve synthetic browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thanaya-browser-review-${{ github.run_number }}
          path: ${{ runner.temp }}/thanaya-browser-review
          if-no-files-found: ignore
          retention-days: 7

  rc-browser-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Browsers + shared libraries are already present. Avoid slow apt mirror
    # downloads; the isolated driver version must match this exact image tag.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --shm-size=1g --init
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Prepare driver matching the bundled native browsers
        run: npm install --prefix "$RUNNER_TEMP/thanaya-browser-driver" --no-save --package-lock=false --ignore-scripts playwright-core@1.65.0 @axe-core/playwright@4.10.2
      - name: Real production preview, accessibility, performance and native WebKit journeys
        run: node tests/private-preview-qa.cjs
        working-directory: frontend
        env:
          NODE_ENV: test
          NODE_PATH: ${{ runner.temp }}/thanaya-browser-driver/node_modules
          THANAYA_QA_SCREENSHOT_DIR: ${{ runner.temp }}/thanaya-rc-browser-review
          THANAYA_RC_QUALITY: '1'
          DEBUG: pw:browser
      - name: Preserve actual RC browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thanaya-rc-browser-review-${{ github.run_number }}
          path: ${{ runner.temp }}/thanaya-rc-browser-review
          if-no-files-found: ignore
          retention-days: 7
