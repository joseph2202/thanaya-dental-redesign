name: Thanaya - Returns & Frontend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/returns-quarantine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-returns-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Rehearse quarantine migration on synthetic legacy database
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_return_disposition.py' -v
      - name: Validate guarded migration against stale and damaged backups
        run: python3 -m unittest discover -s backend/tests -p 'test_apply_return_disposition.py' -v
      - name: Rehearse financial migration without touching shop data
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_finance_ledger.py' -v
      - name: Verify guarded finance apply on disposable databases
        run: python3 -m unittest discover -s backend/tests -p 'test_apply_finance_ledger.py' -v
      - name: Rehearse ERP tables on disposable SQLite without touching shop
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_erp_procurement.py' -v
      - name: Guarded ERP migration checks on temporary backups
        run: python3 -m unittest discover -s backend/tests -p 'test_apply_erp_procurement.py' -v
      - name: Rehearse ERP03 receipts on disposable SQLite
        run: python3 -m unittest discover -s backend/tests -p 'test_rehearse_erp_receiving.py' -v
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Isolated order and return checks
        run: npm run test:orders
        working-directory: backend
        env:
          NODE_ENV: test
          # Each runner creates its own temporary SQLite DB inside the test script.
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Auth and session security regression checks
        run: node tests/auth.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Admin role boundary regression checks
        run: node tests/roles.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Delivery and store-settings regression checks
        run: node tests/settings.integration.cjs && node tests/delivery.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Coupons and discount regression checks
        run: node tests/coupons.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Production-dependency vulnerability scan (backend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - name: Isolated financial ledger checks
        run: node tests/finance.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Isolated ERP supplier and purchasing checks
        run: node tests/procurement.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Isolated ERP physical receiving and stock invariants
        run: node tests/receiving.integration.cjs
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-not-used-by-live-store
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Production-dependency vulnerability scan (frontend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Browser-token storage and cookie transport regression guard
        run: node tests/auth-cookie-transport.cjs
        working-directory: frontend
      - name: Production frontend build
        run: npm run build
        working-directory: frontend
        env:
          NODE_ENV: production
          THANAYA_INTERNAL_API_ORIGIN: http://127.0.0.1:4000
      - name: Verify production Next.js security response headers
        run: node tests/security-headers.cjs
        working-directory: frontend
        env:
          NODE_ENV: test
      - name: Prepare browser E2E driver
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
        working-directory: frontend
      - name: Full-stack session and CSRF smoke through Next.js API rewrite
        run: node tests/fullstack-session-proxy.cjs
        working-directory: frontend
        env:
          NODE_ENV: test
